<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BROMEDIN ENTERPRISE PVT LIMITED</title>
    <link rel="stylesheet" href="style.css">
    <!-- GSAP for core animation & ScrollTrigger to lock the scroll -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>

    <!-- THE TOP FIXED DASHBOARD NAV BAR -->
    <header class="terminal-nav">
        <div class="nav-left">
            <span class="terminal-logo">⬜ BROMEDIN</span>
            <span class="nav-divider">|</span>
            <span class="nav-item">System</span>
            <span class="nav-item">Markets</span>
            <span class="nav-item">Insights</span>
            <span class="nav-item">Resources</span>
            <span class="nav-item">About</span>
        </div>
        <div class="nav-right">
            <span class="phone-icon">📞</span>
            <button class="join-btn">Join network</button>
        </div>
    </header>

    <!-- THE PINNED MAIN VIEWPORT CONTAINER -->
    <div class="scroll-wrapper">
        <section class="scene-container">
            
            <!-- THE HORIZONTAL DRIVING TRACK -->
            <div class="truck-track">
                
                <!-- Slide 1: The DAF GHP Truck Introduction -->
                <div class="slide segment-1">
                    <div class="text-overlay">
                        <h1>We have reinvented the future of freight.</h1>
                    </div>
                    <!-- Replace with your clean DAF GHP image -->
                    <img src="https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?auto=format&fit=crop&q=80&w=1400" alt="DAF GHP Truck" class="truck-image">
                </div>

                <!-- Slide 2: The DAF Refrigerated Truck & AI Telemetry -->
                <div class="slide segment-2">
                    <div class="text-overlay">
                        <h1>AI-native technology that turns managing yards into a science.</h1>
                    </div>
                    <!-- Replace with your clean DAF Refrigerated image -->
                    <img src="https://images.unsplash.com/photo-1516576475557-9f8854bc4036?auto=format&fit=crop&q=80&w=1400" alt="DAF Refrigerated Truck" class="truck-image reefer">
                    
                    <!-- Tech overlay grid that fades in over the reefer truck -->
                    <div class="tech-grid-matrix"></div>
                </div>

                <!-- Slide 3: The Final Concrete Statement -->
                <div class="slide segment-3">
                    <div class="text-overlay central">
                        <h1>Imagine the yard as an intelligent bridge seamlessly connecting highway to warehouse.</h1>
                        <p class="brand-sub">BROMEDIN ENTERPRISE PVT LIMITED</p>
                    </div>
                </div>

            </div>

        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
